<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Log in | Doroos</title>
<link rel="icon" type="image/svg+xml" href="logo.svg">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <a class="logo" href="index.html"><img src="logo.svg" alt="" width="36" height="36"><span>Doroos</span></a>
  <nav><a href="index.html">Home</a><a href="login.html">Log in</a><a href="register.html">Sign up</a></nav>
</header>
<main class="auth-wrap">
  <form class="card-form" action="#" method="post">
    <h1>Log in</h1>
    <p class="sub">Enter your email and password.</p>

    <label for="email">Email</label>
    <input id="email" name="email" type="email" required>

    <label for="pass">Password</label>
    <input id="pass" name="password" type="password" required>

    <button class="btn full" type="submit">Log in</button>
    <p class="switch">New here? <a href="register.html">Create an account</a></p>
    <p class="preview-links">Design preview only:
      <a href="teacher-courses.html">Teacher dashboard</a> ·
      <a href="student-courses.html">Student dashboard</a></p>
  </form>
</main>
</body>
</html>
