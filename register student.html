<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign up | Doroos</title>
<link rel="icon" type="image/svg+xml" href="logo.svg">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <a class="logo" href="index.html"><img src="logo.svg" alt="" width="36" height="36"><span>Doroos</span></a>
  <nav><a href="index.html">Home</a><a href="login.html">Log in</a><a href="register.html">Sign up</a></nav>
</header>
<main class="auth-wrap">
  <form class="card-form" action="#" method="post">
    <h1>Create an account</h1>
    <p class="sub">Fill in your details to get started.</p>

    <div class="row">
      <div><label for="first">First name</label><input id="first" name="first_name" type="text" required></div>
      <div><label for="last">Last name</label><input id="last" name="last_name" type="text" required></div>
    </div>

    <label for="email">Email</label>
    <input id="email" name="email" type="email" required>

    <label for="pass">Password</label>
    <input id="pass" name="password" type="password" minlength="6" required>

    <span class="group-title">Gender</span>
    <div class="choices">
      <label><input type="radio" name="gender" value="male" required> Male</label>
      <label><input type="radio" name="gender" value="female"> Female</label>
    </div>

    <span class="group-title">Hobbies</span>
    <div class="choices">
      <label><input type="checkbox" name="hobbies[]" value="reading"> Reading</label>
      <label><input type="checkbox" name="hobbies[]" value="sports"> Sports</label>
      <label><input type="checkbox" name="hobbies[]" value="drawing"> Drawing</label>
      <label><input type="checkbox" name="hobbies[]" value="coding"> Coding</label>
      <label><input type="checkbox" name="hobbies[]" value="music"> Music</label>
      <label><input type="checkbox" name="hobbies[]" value="travel"> Travel</label>
    </div>

    <label for="birth">Birthdate</label>
    <input id="birth" name="birthdate" type="date" required>

    <span class="group-title">Sign up as</span>
    <div class="choices">
      <label><input type="radio" name="role" value="student" required> Student</label>
      <label><input type="radio" name="role" value="teacher"> Teacher</label>
  
    </div>

    <button class="btn full" type="submit"  >Create account </button> 
    
    <p class="switch">Already have an account? <a href="login.html">Log in</a></p>
  </form>
</main>
</body>
</html>
